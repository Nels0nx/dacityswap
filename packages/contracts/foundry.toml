[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10_000
evm_version = "cancun"
# The settlement vectors are generated by escrow-core and checked against the contract.
fs_permissions = [{ access = "read", path = "../escrow-core/vectors" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 96
fail_on_revert = true

[fmt]
line_length = 110

[lint]
# Style notes that do not apply here: the public immutables are part of the ABI and keep their
# camelCase names, the modifiers are two lines each, and the vector test reads one file.
exclude_lints = [
  "screaming-snake-case-immutable",
  "unwrapped-modifier-logic",
  "asm-keccak256",
  "unsafe-cheatcode",
]
